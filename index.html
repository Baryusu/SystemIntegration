<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oddity Registry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="noise"></div>
    <header class="topbar">
        <a class="brand" href="#dashboard" aria-label="Oddity Registry home">
            <span class="brand-mark">✳</span>
            <span>ODDITY<br><em>REGISTRY</em></span>
        </a>
        <div class="status"><span class="status-dot"></span> FIELD NODE 07 <span class="status-divider">|</span> LOCAL ONLY</div>
        <button class="top-add" data-route="new"><span>＋</span> log an oddity</button>
    </header>

    <div class="app-shell">
        <aside class="sidebar">
            <p class="eyebrow">Navigation / 00—04</p>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="#dashboard" data-nav="dashboard"><span class="nav-number">00</span><span>control room</span><span class="nav-arrow">↗</span></a>
                <a href="#archive" data-nav="archive"><span class="nav-number">01</span><span>oddity archive</span><span class="nav-arrow">↗</span></a>
                <a href="#new" data-nav="new"><span class="nav-number">02</span><span>new observation</span><span class="nav-arrow">↗</span></a>
                <a href="#settings" data-nav="settings"><span class="nav-number">03</span><span>registry rules</span><span class="nav-arrow">↗</span></a>
            </nav>
            <div class="sidebar-note">
                <span class="stamp">FOR YOUR EYES<br>AND OTHER ORGANS</span>
                <p>Every strange thing deserves a place to be properly documented.</p>
            </div>
            <div class="orbit orbit-small"></div>
        </aside>

        <main id="app" class="content" aria-live="polite"></main>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script src="app.js"></script>
</body>
</html>
